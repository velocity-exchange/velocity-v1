name: npm-publish

# Push a tag `npm-<package>-v<version>` to publish ONE library package, e.g.
# `npm-sdk-v0.1.1`, `npm-vaults-sdk-v0.1.2`. `<package>` is the directory name
# under `packages/`; the version is everything after the LAST `-v` (so package
# keys may themselves contain `-v`), mirroring the docker-on-tag convention
# (`docker-<app>-v<version>`). The tag version must match that package's
# package.json `version` (set by the changesets "Version Packages" flow).
#
# Publishes via npm OIDC **trusted publishing** (no static NPM token). The job
# requests an `id-token`, and `npm publish` exchanges it with the registry for a
# short-lived credential — so each package must have this workflow configured as
# a trusted publisher on npmjs.com. Requires npm >= 11.5.1 (installed below).
#
# `bun publish` is NOT used: bun does not implement npm's OIDC trusted-publishing
# flow (it only reads a static token and would fail with "missing
# authentication"). The one thing bun gave us — rewriting `workspace:*` ranges to
# concrete versions in the manifest, which npm does not do — is handled instead
# by `.github/scripts/rewrite-workspace-deps.mjs`, run before publish.
#
# Every published tarball also gets a GitHub build-provenance attestation, which
# binds the exact bytes npm serves to this workflow, commit, and runner. Verify
# with `gh attestation verify <tarball> -R velocity-exchange/protocol-v2-shadow`.
# npm's own `--provenance` flag is deliberately NOT used: it refuses to run from
# a private source repo, which is why every sdk version up to 0.13.0 shipped with
# no attestation at all. Swap these steps for `--provenance` (matching
# velocity-common) once this repo is public and consumers can verify via the
# public Sigstore log and `npm audit signatures`.
on:
  push:
    tags:
      - 'npm-*-v*'

permissions:
  contents: read
  id-token: write # mint the OIDC token npm trusted publishing exchanges for a credential
  attestations: write # record the build-provenance attestation for the published tarball

env:
  # Disable Turborepo anonymous telemetry — this job runs `turbo run build` and
  # mints an OIDC publish credential. DO_NOT_TRACK is the cross-tool standard;
  # TURBO_TELEMETRY_DISABLED is turbo's own switch.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    # TEMPORARY: vaults-sdk and admin-cli are not ready to publish publicly.
    # Skip (don't fail) their release tags so the check stays green and no
    # "publish failed" Slack alert fires. Remove this guard when they're cleared.
    if: ${{ !startsWith(github.ref_name, 'npm-vaults-sdk-v') && !startsWith(github.ref_name, 'npm-cli-admin-v') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: parse
        name: Parse package + version from tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          rest="${tag#npm-}"
          pkg="${rest%-v*}"          # strip the trailing -v<version>
          version="${rest##*-v}"     # everything after the last -v (bare semver)
          path="packages/$pkg"
          echo "Parsed pkg=$pkg version=$version from tag=$tag"
          [ -f "$path/package.json" ] || { echo "::error::no package at $path (tag $tag)"; exit 1; }
          name=$(node -p "require('./$path/package.json').name")
          pkgver=$(node -p "require('./$path/package.json').version")
          if [ "$(node -p "require('./$path/package.json').private || false")" = "true" ]; then
            echo "::error::$name is private — not publishable"; exit 1
          fi
          if [ "$pkgver" != "$version" ]; then
            echo "::error::tag version ($version) != $name package.json version ($pkgver)"; exit 1
          fi
          {
            echo "path=$path"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # See main.yml: give node-hid's source-build fallback a working toolchain.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      - name: Build package (+ deps)
        run: bunx turbo run build --filter="${{ steps.parse.outputs.name }}"
      - name: Install npm with trusted-publishing support
        run: |
          set -euo pipefail
          # npm OIDC trusted publishing needs npm >= 11.5.1. The runner's
          # preinstalled npm is older and its global prefix is root-owned, so
          # install a pinned npm into a user-writable prefix (no sudo) and put
          # its bin ahead of the system one for the steps that follow.
          npm install --no-save --prefix "$RUNNER_TEMP/npm-cli" npm@11.17.0
          echo "$RUNNER_TEMP/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-cli/node_modules/.bin/npm" --version
      - name: Publish
        run: |
          set -euo pipefail
          name="${{ steps.parse.outputs.name }}"
          ver="${{ steps.parse.outputs.version }}"
          path="${{ steps.parse.outputs.path }}"
          published=$(npm view "$name@$ver" version 2>/dev/null || echo "")
          if [ "$published" = "$ver" ]; then
            echo "already published $name@$ver — nothing to do"; exit 0
          fi
          # npm does not understand the workspace: protocol — rewrite those
          # ranges to concrete versions before packing.
          node .github/scripts/rewrite-workspace-deps.mjs "$path"
          echo "publishing $name@$ver"
          ( cd "$path" && npm publish --access public )
      # Attest AFTER publish, deliberately. The tarball the registry serves is
      # what consumers install, so that is what the attestation must cover — and
      # ordering it last means a hiccup here can never block a release that has
      # already shipped. The job still fails loudly so it gets fixed and re-run
      # (publish is idempotent, so a re-run just re-attests).
      - name: Fetch the published tarball
        id: tarball
        env:
          NAME: ${{ steps.parse.outputs.name }}
          VER: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          url=""
          for attempt in 1 2 3; do
            if url=$(npm view "$NAME@$VER" dist.tarball 2>/dev/null) && [ -n "$url" ]; then
              break
            fi
            echo "registry not ready for $NAME@$VER (attempt $attempt); retrying"
            sleep 5
          done
          [ -n "$url" ] || { echo "::error::could not resolve dist.tarball for $NAME@$VER"; exit 1; }
          out="$RUNNER_TEMP/$(basename "$url")"
          curl -fsSL "$url" -o "$out"
          # Guard against attesting anything other than the exact bytes npm
          # serves: compare against the registry's own integrity hash.
          integrity=$(npm view "$NAME@$VER" dist.integrity)
          actual="sha512-$(openssl dgst -sha512 -binary "$out" | openssl base64 -A)"
          if [ "$actual" != "$integrity" ]; then
            echo "::error::$NAME@$VER tarball does not match registry integrity ($actual != $integrity)"
            exit 1
          fi
          echo "tarball=$out" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.tarball }}
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: '#code-review'
          slack-message: '<!here> ❌ npm publish failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
