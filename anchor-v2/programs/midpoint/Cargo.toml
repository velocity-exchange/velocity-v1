[package]
name = "midpoint"
version = "0.1.0"
description = "Velocity midpoint (spline) quoter program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "midpoint"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-log-ix-name = []
idl-build = []
profile = ["anchor-v2-testing/profile"]

[dependencies]
# Anchor v2 alpha (anchor-next). Pinned to an exact rev — the alpha branch moves.
anchor-lang-v2 = { git = "https://github.com/otter-sec/anchor.git", rev = "4fbe613b2dc739a849355889ce1f27eb6d03a148" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
static_assertions = "1.1.0"
wincode = { version = "0.5", features = ["derive"] }
# Declares the quoter wire types this program writes. `wincode-derive` gives
# them the same derives the rest of this program's wire structs use. No borsh
# reaches this binary: the spec's anchor derives are behind a feature only
# velocity turns on.
quoter-spec = { path = "../../../crates/quoter-spec" }

[dev-dependencies]
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "4fbe613b2dc739a849355889ce1f27eb6d03a148" }
litesvm = "0.11.0"
# Recomputes velocity's `State` layout from its canonical IDL so the
# hardcoded `hot_flow_authority` offset can't drift (see `src/velocity.rs`).
serde_json = "1"
solana-account = "3.2.0"
solana-clock = "3"
solana-pubkey = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
