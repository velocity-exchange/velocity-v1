name: main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, devnet, feat/monorepo-consolidation]
  # Drives the non-gating `rust-live-tests` job (live RPC / funded keys / gRPC /
  # Jupiter / Titan). Nightly + on-demand; never blocks PRs.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter (the `changes` job) calls the Pull Requests API to list
  # changed files on pull_request events. Without this the token defaults to
  # contents/metadata only and the filter step fails with
  # "Resource not accessible by integration".
  pull-requests: read

defaults:
  run:
    shell: bash
    working-directory: .

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.91.1
  # Pinned nightly for `cargo fmt` only (rustfmt.toml uses the nightly-only
  # imports_granularity/group_imports options). Builds/clippy stay on stable.
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-07-25
  # 4.3.0 is the earliest release whose cargo-build-sbf (platform-tools v1.57)
  # can emit SBPFv3; SIMD-0500 makes that the only deployable format from Agave
  # v4.4 on. 4.2.2 ships cargo-build-sbf 4.1.0 / v1.54, under the v1.56 minimum.
  SOLANA_VERSION: 4.3.0
  ANCHOR_VERSION: 1.0.2
  NODE_VERSION: '24.x.x'
  # Disable Turborepo anonymous telemetry in CI (these runners handle deploy
  # keys / secrets). DO_NOT_TRACK is the cross-tool standard; TURBO_TELEMETRY_
  # DISABLED is turbo's own switch — set both so it's off regardless.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # solanafoundation/solana-verifiable-build tags lag behind agave releases;
  # check https://hub.docker.com/r/solanafoundation/solana-verifiable-build/tags
  # for the latest available tag before bumping SOLANA_VERSION above.
  # 4.1.2 is the newest published tag. It ships platform-tools v1.54, but the
  # verified-build job forces v1.57 via --cargo-build-sbf-args, so the image's
  # own version does not decide the bytecode version. Bumping the tag is still
  # worthwhile when a 4.3.x lands, to drop the override.
  VERIFIABLE_BUILD_IMAGE: solanafoundation/solana-verifiable-build:4.1.2

jobs:
  # Single change-detection pass. Heavy rust/anchor jobs gate on these outputs so
  # a docs-only or pure-TS PR doesn't pay for a 60-min anchor run or a full rust
  # rebuild. dorny/paths-filter diffs the PR base (or the pushed range on master).
  changes:
    name: Detect changed paths
    runs-on: ubicloud
    outputs:
      program: ${{ steps.filter.outputs.program }}
      program_version: ${{ steps.filter.outputs.program_version }}
      rust_workspace: ${{ steps.filter.outputs.rust_workspace }}
      integration_tests: ${{ steps.filter.outputs.integration_tests }}
      anchor: ${{ steps.filter.outputs.anchor }}
      docker_ts: ${{ steps.filter.outputs.docker_ts }}
      docker_rust: ${{ steps.filter.outputs.docker_rust }}
      # True when the PR changes nothing but package versions. See the step.
      version_only: ${{ steps.version_only.outputs.value }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The changesets bot's "Version Packages" PR (changesets.yml) only rewrites
      # package.json `version` fields, CHANGELOGs, and .changeset/*, but those
      # live under packages/** and apps/**, so the `anchor` and `docker_ts`
      # filters below match it every single time. It therefore paid for two
      # 60-minute suites and two image builds that cannot say anything about a
      # version string.
      #
      # This is deliberately decided from the DIFF CONTENT, not from the branch
      # name or the PR author. `changeset-release/master` is an ordinary
      # unprotected branch and `github-actions[bot]` is reachable by anyone who
      # can add a workflow, so gating on either would let a push-access user
      # disarm a required status check (a skipped job satisfies one) by pushing
      # code to a suggestively named branch. Content cannot be spoofed that way:
      # a PR that touches program or SDK source never qualifies, whoever opens
      # it and wherever from.
      #
      # Every unexpected condition (a fetch failure, an added or deleted
      # package.json, an unreadable blob, a path outside the allowlist) leaves
      # the verdict false and runs the heavy jobs. The failure direction is
      # always "test more", never "test less".
      - name: Detect a version-bump-only PR
        id: version_only
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # errexit must be OFF: the runner invokes this step as
          # `bash -e -o pipefail`, and `set -u`/`set -o pipefail` do not clear
          # that. Under -e a missing blob (an added or deleted package.json) or
          # unparseable JSON aborts the step, failing the whole `changes` job
          # and every job that needs it. Those cases must fall through to
          # verdict=false and let the heavy jobs run instead.
          set +e
          set -uo pipefail
          verdict=false
          # checkout is depth-1 on the merge ref, so fetch both endpoints. A
          # depth-1 fetch of a commit still carries its complete tree, which is
          # all `git show <sha>:<path>` needs.
          #
          # The file list is captured up front rather than piped into the loop:
          # a `git diff` that failed inside a process substitution would run the
          # loop zero times and leave an affirmative verdict standing.
          #
          # `--no-renames` is load-bearing. Rename detection is on by default and
          # reports a rename as the destination path ALONE, so renaming a source
          # or test file to something like tests/x/CHANGELOG.md would show the
          # allowlisted destination and hide the deletion, dropping a test while
          # skipping the suite that would have noticed. Disabling it splits every
          # rename into its delete and add halves so both paths get checked.
          if git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>&1 \
            && files=$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA") \
            && [ -n "$files" ]; then
            verdict=true
            while IFS= read -r f; do
              case "$f" in
                .changeset/*) continue ;;
                CHANGELOG.md | */CHANGELOG.md) continue ;;
                package.json | */package.json)
                  # Identical once `version` is dropped => a pure version bump.
                  # Anything else in there (a dependency, a script, a turbo or
                  # workspace field) is a real build input and must not skip the
                  # image builds. Both sides must be non-empty: a missing blob
                  # (added/deleted file) or unparseable JSON yields "" on both
                  # sides, and "" = "" must not read as "no change".
                  before=$(git show "$BASE_SHA:$f" 2>/dev/null | jq -S 'del(.version)' 2>/dev/null)
                  after=$(git show "$HEAD_SHA:$f" 2>/dev/null | jq -S 'del(.version)' 2>/dev/null)
                  if [ -n "$before" ] && [ -n "$after" ] && [ "$before" = "$after" ]; then
                    continue
                  fi
                  ;;
              esac
              echo "not version-only, because of: $f"
              verdict=false
              break
            done <<< "$files"
          else
            echo "no readable diff for this PR; treating it as a normal one"
          fi
          echo "version-bump-only PR: $verdict"
          echo "value=$verdict" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            # velocity program source (drives fmt-clippy + unit-tests)
            program:
              - 'programs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Anchor.toml'
              - 'rust-toolchain*'
            # program crate version bump only (drives the verifiable build)
            program_version:
              - 'programs/velocity/Cargo.toml'
            # rust/ workspace; also the program, consumed as a host path-dep,
            # and the canonical IDL, consumed by velocity-rs's build.rs
            rust_workspace:
              - 'rust/**'
              - 'programs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/sdk/src/idl/velocity.json'
            # litesvm integration tests: their own crate, plus every .so they
            # load (velocity, and clob/midpoint out of the anchor-v2 workspace).
            integration_tests:
              - 'integration-tests/**'
              - 'programs/**'
              - 'anchor-v2/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
            # anchor integration tests need the program, the tests, and the SDK
            anchor:
              - 'programs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Anchor.toml'
              - 'rust-toolchain*'
              - 'tests/**'
              - 'test-scripts/**'
              - 'packages/sdk/**'
              - 'packages/vaults-sdk/**'
            # TS app docker images build from the whole bun/turbo workspace, so any
            # app or shared-package change can affect them.
            docker_ts:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'docker/ts-app.Dockerfile'
              - 'docker/ts-app.Dockerfile.dockerignore'
              - '.dockerignore'
              - 'docker-info.json'
            # rust app docker images (keep-rs/swift) build the rust workspace, which
            # consumes the velocity program as a host path-dep.
            docker_rust:
              - 'rust/**'
              - 'programs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # velocity-rs's build.rs regenerates velocity_idl.rs from this IDL,
              # so an IDL-only change does change the built binaries.
              - 'packages/sdk/src/idl/velocity.json'
              - 'docker/rust-app.Dockerfile'
              - 'docker/rust-app.Dockerfile.dockerignore'
              - '.dockerignore'
              - 'docker-info.json'
  fmt-clippy:
    name: fmt & clippy
    needs: changes
    if: ${{ needs.changes.outputs.program == 'true' }}
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
          components: rustfmt, clippy
      - name: Install Rust nightly (rustfmt only)
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
      - name: Cache build files
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Cargo fmt
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} fmt -- --check
      - name: Cargo clippy
        run: cargo clippy -p velocity
  unit-tests:
    name: Unit tests
    needs: changes
    if: ${{ needs.changes.outputs.program == 'true' }}
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Run package checks
        run: cargo check # run package checks
      - name: Run unit tests
        run: cargo test --lib # run unit tests
  # The litesvm suite in `integration-tests/` — a standalone workspace that loads
  # the real .so fixtures and drives real instructions, so it catches what
  # `cargo test --lib` structurally cannot: account layouts as the runtime sees
  # them, cross-program CPI, and SBF miscompiles (tests/init_probe.rs exists for
  # exactly the platform-tools stack-frame bug documented in CLAUDE.md). It needs
  # three built programs: velocity, plus clob + midpoint from the anchor-v2
  # workspace.
  integration-tests:
    name: Integration tests (litesvm)
    needs: changes
    if: ${{ needs.changes.outputs.integration_tests == 'true' }}
    runs-on: ubicloud
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      # Caches the cargo registry plus the integration-tests host target dir
      # (velocity compiled as a HOST lib — safe to reuse). The root workspace's
      # SBF target dir is deliberately NOT cached: reusing target/sbpf-solana-solana
      # across runs is the documented corruption hazard in this repo (the build
      # key misses dep-resolution changes and the .so ends up reading wrong
      # offsets), which is precisely the class of bug this job exists to catch.
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            integration-tests
            anchor-v2
          cache-on-failure: 'true'
      - uses: ./.github/actions/setup-solana/
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # deploy-scripts/build-sbf.sh pins the platform-tools version and emits
      # SBPFv3. The bundled default miscompiles velocity (see CLAUDE.md), and
      # v1.54 can no longer compile it. The `test` flavor matches the host
      # build in integration-tests/Cargo.toml (no-entrypoint + anchor-test), or
      # host structs will not match the loaded layout.
      - name: Build velocity .so (SBF, pinned platform-tools)
        run: |
          set -euo pipefail
          rm -rf target/sbpf*-solana-solana target/deploy
          bash deploy-scripts/build-sbf.sh test velocity
      # The fixture .so files the suite CPIs into; same commands as the
      # `program:build:clob` / `program:build:midpoint` package.json scripts.
      - name: Build anchor-v2 fixture programs (clob, midpoint)
        run: |
          set -euo pipefail
          bun run program:build:clob
          bun run program:build:midpoint
      # The quoter programs' own suites, run here because this is the job that
      # already has their fixtures built: `clob_tests` and `midpoint_tests`
      # load the .so files from the step above. They are the only gate on the
      # `quote_v0` / `quote_l3_v0` / `execute_v0` wire, on the response-region
      # ceilings, and on the layout assertions that hold `ClobHeaderV0` and
      # `OrderNodeV0` against `clob-spec` — which velocity reads through, from
      # a workspace that cannot see these types.
      - name: cargo test anchor-v2 (clob, midpoint)
        working-directory: anchor-v2
        run: cargo test --locked
      - name: cargo test integration-tests
        working-directory: integration-tests
        run: cargo test --locked
  cargo-audit:
    name: Cargo audit
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache cargo-audit version
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit # Using args from .cargo/audit.toml
        run: cargo audit
  cargo-deny:
    name: Cargo deny
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache cargo-deny/cargo-audit versions
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      # Pinned: the DB hand-off below depends on both tools' exact on-disk
      # layout and hashing behaviour (see the "Expose the database" step).
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # cargo-deny 0.20.x fetches the RustSec advisory DB by shelling out to
      # the git CLI (its CHANGELOG PR#830 dropped the previous gix-library
      # path, and there is no config switch back). GitHub rejects that
      # unauthenticated git-CLI clone from this runner, and we do not want to
      # hand the job a GITHUB_TOKEN. cargo-audit fetches the same DB with the
      # `rustsec` crate's gix-library path, which GitHub does accept, so use
      # cargo-audit purely as the fetch mechanism and point cargo-deny at its
      # clone (offline, below). The audit *result* is gated by the separate
      # Cargo audit job above; here only the clone matters.
      - name: Fetch advisory database
        run: |
          ADVISORY_DB="$RUNNER_TEMP/advisory-db"
          cargo audit --db "$ADVISORY_DB" >/dev/null 2>&1 || true
          test -d "$ADVISORY_DB/.git" || { echo "::error::advisory database was not fetched"; exit 1; }
      # cargo-deny stores its DB at <db-path>/<last URL path segment>-<xxhash64
      # of the lowercased URL, seed 0xca80de71> (cargo-deny's url_to_db_path,
      # src/advisories/helpers/db.rs). For the default RustSec URL that is
      # `advisory-db-3157b0e258782691` -- pinned to cargo-deny 0.20.2, hence
      # the version pin above. Symlink cargo-audit's clone in under that name
      # so cargo-deny's offline open finds it, and point deny.toml's
      # `db-path` (via CARGO_DENY_DB_PATH) at the scratch dir holding it.
      - name: Expose the database to cargo-deny
        run: |
          DENY_DBS="$RUNNER_TEMP/advisory-dbs"
          mkdir -p "$DENY_DBS"
          LINK="$DENY_DBS/advisory-db-3157b0e258782691"
          rm -rf "$LINK"
          ln -s "$RUNNER_TEMP/advisory-db" "$LINK"
          test -L "$LINK" && test "$(readlink "$LINK")" = "$RUNNER_TEMP/advisory-db"
          echo "CARGO_DENY_DB_PATH=$DENY_DBS" >> "$GITHUB_ENV"
      # `--offline` below also makes cargo-deny's own `cargo metadata`
      # resolution offline, so prefetch both workspaces' crates.io deps first
      # (that part of the fetch is plain HTTPS and works fine on the runner).
      - name: Prefetch crates
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path rust/Cargo.toml
      # `sources` is the reason this job exists: a dependency may only come from
      # crates.io or from a git remote explicitly allowlisted in deny.toml, so a
      # new git dependency cannot land unreviewed. `licenses` and `bans` ride
      # along. The two workspaces are deliberately not unified (see the
      # `exclude` note in Cargo.toml), so each is checked in turn against the
      # one shared config.
      # `--locked` keeps the scan honest: cargo-deny resolves the graph through
      # `cargo metadata`, which will happily re-resolve from the manifests when a
      # lockfile is out of sync. That would check a graph nobody committed, and the
      # new-dependency gate (which diffs lockfiles) would never see it either.
      # `--offline` skips cargo-deny's own (git-CLI) advisory-DB fetch and reads
      # the clone staged above instead; it enforces `maximum-db-staleness`
      # against that clone's local git metadata, no network needed.
      - name: Run cargo-deny (program workspace) # Using args from deny.toml
        run: cargo deny --offline --locked --manifest-path Cargo.toml --config deny.toml check
      - name: Run cargo-deny (rust workspace) # Using args from deny.toml
        run: cargo deny --offline --locked --manifest-path rust/Cargo.toml --config deny.toml check
  prettier:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      - name: Print prettier version
        run: bunx prettier --version
      - name: Run prettier
        run: bun run prettify
  lint:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
  ts-build:
    name: Build TS workspace
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Restore the turbo cache across runs. CI machines start cold, so without
      # this every run recompiles the whole graph from scratch. `github.job`
      # scopes the key per job; the prefix restore-key falls back to the latest
      # prior run, then turbo validates each task by input hash.
      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      # turbo builds the whole graph in topo order (sdk -> apps + cli-admin)
      - name: Build all packages + apps
        run: bunx turbo run build
  ts-typecheck:
    # `ts-build` bundles with esbuild, which strips types WITHOUT checking them,
    # so type errors (e.g. an app reading a renamed/removed SDK export) compile
    # to a clean bundle that crashes at runtime. This job runs `tsc --noEmit`
    # across the workspace so those are caught at PR time instead of in a pod.
    name: TS typecheck
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      # typecheck dependsOn ^build (turbo.json) so workspace .d.ts are present.
      - name: Typecheck all packages + apps
        run: bunx turbo run typecheck
  ts-tests:
    name: TS unit tests (libs)
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Cross-run turbo cache. ts-tests runs in parallel with ts-build (no
      # dependency), so the first cold run rebuilds its deps (incl. the SDK the
      # app suites pull in) harmlessly alongside ts-build; subsequent runs replay
      # from this cache instead of recompiling.
      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      # Hermetic jest unit suites: the workspace packages plus the apps/* suites
      # that run green on the @swc/jest app preset. `test` dependsOn `^build`, so
      # turbo builds each suite's deps first. @velocity-exchange/sdk runs in its
      # own `sdk-tests` job below (mocha + bun test, not the jest preset this
      # turbo filter targets).
      - name: Run unit tests (libs + wired app suites)
        run: >-
          bunx turbo run test
          --filter='./packages/*' --filter='!@velocity-exchange/sdk'
          --filter=@velocity-exchange/dlob-server
          --filter=@velocity-exchange/keeper-bots-v2
  sdk-tests:
    name: SDK offline tests (@velocity-exchange/sdk)
    runs-on: ubicloud
    # The SDK suite is mocha + `bun test` (VelocityCore), not the jest preset the
    # ts-tests turbo filter targets, so it runs here. Offline only: tests/ci needs
    # live RPC (MAINNET/DEVNET_RPC_ENDPOINT) and runs in verify-sdk-configs.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      - name: Run SDK offline suites
        working-directory: packages/sdk
        run: |
          bun run test
          bun run test:parity
          bun run test:bignum
          bun run test:events
          bun run test:velocitycore
  rust-workspace-check:
    name: Check rust workspace (velocity-rs/keep-rs/swift)
    needs: changes
    if: ${{ needs.changes.outputs.rust_workspace == 'true' }}
    runs-on: ubicloud
    # The offline-deterministic subset gates. Live tests (live RPC, funded
    # keypairs, gRPC, Jupiter/Titan) are compiled out by default: they live
    # behind the `rpc_tests` cargo feature (velocity-rs + swift) and run only in
    # the separate, non-blocking `rust-live-tests` job. Redis-backed tests run
    # here against the service container below — Redis is cheap and hermetic, so
    # those stay in the gate rather than the live job.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
          override: true
      # The stable rustfmt above stays: velocity-rs's build.rs shells out to the
      # default-toolchain rustfmt when regenerating velocity_idl.rs. The nightly
      # one is only for the fmt gate (nightly-only rustfmt.toml options).
      - name: Install Rust nightly (rustfmt only)
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          workspaces: rust
          cache-on-failure: 'true'
      # Restores the `cargo fmt --check` gate velocity-rs ran upstream (keep-rs/swift
      # only ran a non-blocking `cargo fmt`); covers the whole rust workspace.
      - name: cargo fmt rust workspace
        run: cargo +${{ env.RUST_NIGHTLY_TOOLCHAIN }} fmt --manifest-path rust/Cargo.toml --all -- --check
      # The velocity-rs example crates (all but dlob-builder) are not workspace
      # members and don't resolve under cargo, so `cargo fmt --all` above never
      # sees them; check each with raw rustfmt at the crate's own edition.
      - name: rustfmt velocity-rs examples
        run: |
          set -euo pipefail
          for d in rust/velocity-rs/examples/*/; do
            ed=$(sed -nE 's/^edition = "([0-9]+)"$/\1/p' "$d/Cargo.toml" | head -1)
            files=$(git ls-files "${d}**/*.rs" "${d}*.rs")
            [ -n "$files" ] && echo "$files" | xargs rustup run ${{ env.RUST_NIGHTLY_TOOLCHAIN }} rustfmt --edition "${ed:-2021}" --check
          done
      # The velocity-rs build.rs regenerates crates/src/velocity_idl.rs from the canonical
      # packages/sdk/src/idl/velocity.json; the velocity program crate is compiled as a host lib path-dep.
      - name: cargo check rust workspace
        run: cargo check --manifest-path rust/Cargo.toml --locked --all-targets
      # build.rs just regenerated velocity_idl.rs from the canonical IDL; a diff
      # means the committed copy is stale. External (git-dep) consumers may build
      # without regenerating — e.g. from a read-only or vendored source dir — so
      # the committed file must stay in sync with the IDL.
      - name: velocity_idl.rs in sync with IDL
        run: git diff --exit-code rust/velocity-rs/crates/src/velocity_idl.rs
      # Gating: offline-deterministic tests only (rpc_tests feature OFF, so all
      # live tests are compiled out). Redis is provided by the service above.
      - name: cargo test rust workspace (offline, gating)
        timeout-minutes: 20
        run: cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
  # Live integration tests: live mainnet/devnet RPC, funded keypairs, gRPC.
  # NOT a PR gate (not in ci-gate's `needs`) — they can't be deterministic and
  # several submit real transactions. Runs on a schedule and on demand with the
  # required secrets. `rpc_tests` unlocks the gated tests.
  #
  # STATUS (TODO): the test code now COMPILES against the forked API, but it has
  # never been *run* — it needs a live velocity deployment to point at. Until
  # velocity is deployed to devnet and the `TEST_*` secrets are set, this job
  # will fail at runtime; that's expected. Final step once devnet is live:
  #   1. set the secrets below, 2. point TEST_DEVNET_RPC_ENDPOINT at the deploy,
  #   3. run via workflow_dispatch and fix whatever the first real run surfaces.
  # `titan` is intentionally NOT enabled: it pulls a dep tree that breaks the
  # velocity host-lib compile, and Titan/Jupiter are mainnet-only swap APIs not
  # relevant to a devnet bring-up. Re-add `titan` (and resolve the dep conflict)
  # if/when those swap tests are wanted.
  rust-live-tests:
    name: Rust live integration tests (non-gating)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubicloud
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          # rustfmt: velocity-idl-gen shells out to it during codegen and panics if
          # missing (the other rust jobs install it too).
          components: rustfmt
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          workspaces: rust
          cache-on-failure: 'true'
      - name: cargo test rust workspace (live)
        timeout-minutes: 30
        env:
          TEST_MAINNET_RPC_ENDPOINT: ${{ secrets.TEST_MAINNET_RPC_ENDPOINT }}
          TEST_DEVNET_RPC_ENDPOINT: ${{ secrets.TEST_DEVNET_RPC_ENDPOINT }}
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_MAINNET_PRIVATE_KEY: ${{ secrets.TEST_MAINNET_PRIVATE_KEY }}
          TEST_GRPC_X_TOKEN: ${{ secrets.TEST_GRPC_X_TOKEN }}
        run: cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets --features "rpc_tests"
  # Devnet end-to-end suite proving the DEPLOYED bots act (tests/devnet_e2e.rs).
  # Manual-only (workflow_dispatch): submits real devnet txs, sets up one side of
  # each flow and polls for the deployed filler/liquidator/settler/crank
  # to act. Single-threaded (all subaccounts share the one TEST_PRIVATE_KEY
  # authority). `--include-ignored` also runs the flaky/infra-dependent scenarios
  # (swift reachability, liquidation via oracle drift), which log INCONCLUSIVE
  # rather than fail when their precondition can't be established.
  devnet-e2e:
    name: Devnet e2e (deployed bots)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          workspaces: rust
          cache-on-failure: 'true'
      - name: cargo test devnet e2e
        timeout-minutes: 30
        env:
          TEST_DEVNET_RPC_ENDPOINT: ${{ secrets.TEST_DEVNET_RPC_ENDPOINT }}
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          # Optional: velocity swift HTTP endpoint; defaults to the drift one if unset.
          SWIFT_HTTP_ENDPOINT: ${{ secrets.SWIFT_HTTP_ENDPOINT }}
        run: cargo test --manifest-path rust/Cargo.toml --locked -p velocity-rs --test devnet_e2e --features "rpc_tests" -- --include-ignored --test-threads=1 --nocapture
  sdk-typecheck:
    name: SDK TypeScript strict check
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile
      - name: TypeScript strict type-check
        run: cd packages/sdk && bunx tsc --noEmit -p tsconfig.json
  anchor-tests:
    name: Anchor tests
    needs: changes
    if: ${{ needs.changes.outputs.anchor == 'true' && needs.changes.outputs.version_only != 'true' }}
    runs-on: ubicloud
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          cache-on-failure: 'true'
          # Cache only the cargo registry/git, NOT the workspace target dir.
          # Reusing SBF artifacts (target/sbpf*-solana-solana) across runs is the
          # documented corruption hazard in this repo — the incremental build
          # key doesn't catch every dep-resolution change, so the resulting .so
          # loads but reads/writes wrong offsets ("Program failed to complete"
          # at runtime). Every anchor build below must start from a clean target.
          cache-targets: 'false'

      - uses: ./.github/actions/setup-solana/

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The avm proxy + the installed version toolchains live in two places:
          # the avm/anchor binaries in ~/.cargo/bin, the toolchains in ~/.avm.
          # Both must persist or the gated install below has to rebuild from src.
          path: |
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-${{ env.ANCHOR_VERSION }}

      # Building avm + anchor-cli from git source takes several minutes, so only
      # do it on a cache miss. On a hit we just re-activate the cached version.
      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          sudo apt update -y && sudo apt install libudev-dev
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}

      - name: Select Anchor version
        run: avm use ${{ env.ANCHOR_VERSION }}

      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile

      - name: install typescript
        run: npm install typescript@5.4.5 -g

      - name: install mocha
        run: |
          npm install ts-mocha@10.0.0 -g
          npm install --global mocha@11.7.5

      # Restore compiled programs from cache keyed on program sources. When
      # nothing under programs/, Cargo.toml, Cargo.lock, or Anchor.toml changed,
      # target/deploy/*.so + IDL/types are restored and the "Build program" step
      # below is skipped — removing the ~6-min SBF compile from SDK/test-only
      # PRs. (Run artifacts don't persist across runs, so a content-hashed cache
      # — not a paths-filter alone — is what lets a later run reuse a prior
      # build.)
      #
      # Split restore/save pattern (NOT the combined actions/cache) so the cache
      # is only written back when the build actually succeeds. The combined
      # action's post-job save runs even on step failure, which would persist a
      # partial build (e.g. .so present but IDL regeneration failed) and poison
      # subsequent runs that hit the same key.
      #
      # Key literal includes the build variant (-anchortest-ltothin-cu16-). If
      # the feature flags or CARGO_PROFILE_RELEASE_* overrides below change,
      # bump this literal so stale variant .so files aren't served from cache.
      - name: Restore compiled program cache
        id: cache-program
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/deploy
            target/idl/velocity.json
            target/types/velocity.ts
          key: ${{ runner.os }}-velocity-program-anchortest-ltothin-cu16-anchor${{ env.ANCHOR_VERSION }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('programs/**', 'Cargo.toml', 'Cargo.lock', 'Anchor.toml', 'deploy-scripts/build-sbf.sh') }}

      # Only recompile when the program sources changed (cache miss).
      # startLiteSVM loads every Anchor.toml localnet program plus jit-proxy from
      # target/deploy, so the whole dir is the cached unit.
      - name: Build program
        if: steps.cache-program.outputs.cache-hit != 'true'
        env:
          # The committed release profile uses `lto = "fat"` + `codegen-units = 1`
          # for the production .so — the slowest possible compile. The test build
          # runs on litesvm and doesn't need it, so override the profile here only
          # (the verified-build job is unaffected). thin LTO keeps most cross-crate
          # optimization while cutting compile time dramatically.
          CARGO_PROFILE_RELEASE_LTO: 'thin'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        # Clean any restored SBF artifacts first — building incrementally on top
        # of them can emit a .so with wrong offsets (see CLAUDE.md). The program
        # cache reuses the *final* .so on a hit; on a miss we always build fresh.
        run: |
          rm -rf target/sbpf*-solana-solana target/deploy
          bash deploy-scripts/build-sbf.sh test
          bun run program:idl

      # Save the compiled program cache only on a cache miss AND only when the
      # build succeeded — prevents a partial build (e.g. IDL gen failed after
      # .so was emitted) from poisoning subsequent runs with the same key.
      - name: Save compiled program cache
        if: steps.cache-program.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/deploy
            target/idl/velocity.json
            target/types/velocity.ts
          key: ${{ runner.os }}-velocity-program-anchortest-ltothin-cu16-anchor${{ env.ANCHOR_VERSION }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('programs/**', 'Cargo.toml', 'Cargo.lock', 'Anchor.toml', 'deploy-scripts/build-sbf.sh') }}

      # run-anchor-tests.sh --skip-build syncs the freshly built/restored IDL
      # into packages/sdk/src/idl and builds the SDK before running the suites:
      # most test files import `../packages/sdk/src/...` (transpiled on the fly by
      # ts-mocha), but many import the package root `../packages/sdk`, which
      # resolves through package.json `main` to packages/sdk/lib/node/index.js and
      # would otherwise be MODULE_NOT_FOUND. The root `bun install` above already
      # installed the workspace, so no separate SDK install is needed here.
      - name: run anchor tests
        env:
          RUST_LOG: solana_runtime::message_processor::stable_log=info
        run: bash test-scripts/run-anchor-tests.sh --skip-build
  vault-tests:
    name: Vault tests
    needs: changes
    if: ${{ needs.changes.outputs.anchor == 'true' && needs.changes.outputs.version_only != 'true' }}
    runs-on: ubicloud
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          cache-on-failure: 'true'

      - uses: ./.github/actions/setup-solana/

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.avm
          key: ${{ runner.os }}-anchor-cli-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        run: |
          sudo apt update -y && sudo apt install libudev-dev
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile

      - name: install typescript
        run: npm install typescript@5.4.5 -g

      - name: install mocha
        run: |
          npm install ts-mocha@10.0.0 -g
          npm install --global mocha@11.7.5

      # Restore compiled programs from cache, same split restore/build/save pattern
      # as the anchor-tests job — without it this job recompiled the ~5 MB velocity
      # SBF program (the slowest build in the repo) from scratch on every run.
      #
      # The cache key is DISTINCT from anchor-tests' (`-vaulttest-nomainnet-`):
      # the vaults suite needs velocity built WITHOUT mainnet-beta (the
      # external-depositor whitelist gate blocks vault CPIs otherwise), so its .so +
      # IDL are a different flavor and must not collide with the anchor-test build.
      # Bump the literal if the feature flags or profile overrides below change.
      - name: Restore compiled program cache
        id: cache-program-vaults
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/deploy
            target/idl/velocity.json
            target/types/velocity.ts
          key: ${{ runner.os }}-velocity-program-vaulttest-nomainnet-thin-cu16-anchor${{ env.ANCHOR_VERSION }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('programs/**', 'Cargo.toml', 'Cargo.lock', 'Anchor.toml', 'deploy-scripts/build-sbf.sh') }}

      # Only recompile when the program sources changed (cache miss). The thin-LTO
      # override matches anchor-tests: the committed release profile uses fat LTO +
      # 1 codegen unit (slowest possible compile) for the production .so, which the
      # bankrun test build doesn't need.
      - name: Build vault test programs
        if: steps.cache-program-vaults.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'thin'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: bash test-scripts/run-vault-tests.sh --build-only

      # Save only on a cache miss AND only when the build succeeded — prevents a
      # partial build from poisoning subsequent runs with the same key.
      - name: Save compiled program cache
        if: steps.cache-program-vaults.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/deploy
            target/idl/velocity.json
            target/types/velocity.ts
          key: ${{ runner.os }}-velocity-program-vaulttest-nomainnet-thin-cu16-anchor${{ env.ANCHOR_VERSION }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('programs/**', 'Cargo.toml', 'Cargo.lock', 'Anchor.toml', 'deploy-scripts/build-sbf.sh') }}

      # --skip-build syncs the freshly built/restored IDL into packages/sdk/src/idl,
      # builds the SDKs, and runs the suite (programs already built/restored above).
      - name: run vault tests
        env:
          RUST_LOG: solana_runtime::message_processor::stable_log=info
        run: bash test-scripts/run-vault-tests.sh --skip-build
  verify-sdk-configs:
    name: Verify SDK Configs
    # Live-RPC SDK tests (tests/ci needs MAINNET/DEVNET_RPC_ENDPOINT). Not a PR
    # gate (not in ci-gate's needs) — runs on schedule + on demand with secrets,
    # same pattern as rust-live-tests.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # node-hid (via @ledgerhq/hw-transport-node-hid) falls back to a source
        # build when its prebuilt-binary download fails (flaky on CI). Install
        # the headers the fallback needs so a failed fetch cannot fail the job.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libusb-1.0-0-dev libudev-dev
          bun install --frozen-lockfile

      - name: Build SDK
        run: bunx turbo run build --filter=@velocity-exchange/sdk

      - name: Install ts-mocha and typescript
        run: |
          npm install -g ts-mocha@10.0.0
          npm install -g typescript@5.4.5

      - name: Run tests
        env:
          MAINNET_RPC_ENDPOINT: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          DEVNET_RPC_ENDPOINT: ${{ secrets.DEVNET_RPC_ENDPOINT }}
        run: ts-mocha ./packages/sdk/tests/ci/*

  verified-build:
    name: Build Verifiable Artifact
    runs-on: ubicloud
    needs: [changes]
    if: ${{ needs.changes.outputs.program_version == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Solana Verify CLI
        run: |
          sudo apt update -y && sudo apt install libudev-dev
          cargo install solana-verify --version 0.5.1 --locked

      # The image's own platform-tools version does not gate the bytecode version.
      # cargo-build-sbf downloads whatever --tools-version asks for, so forcing
      # v1.57 inside the 4.1.2 image (which ships v1.54, under Anza's v1.56
      # minimum) produces a compliant SBPFv3 artifact. Verified by building
      # token_faucet this way and checking the ELF e_flags.
      #
      # Anyone reproducing this hash has to pass the same two flags, so keep them
      # together with the image tag in whatever verification instructions ship
      # alongside a release.
      - name: Verifiable Build
        run: |
          solana-verify build --library-name velocity \
            -b ${{ env.VERIFIABLE_BUILD_IMAGE }} \
            --arch v3 \
            --cargo-build-sbf-args=--tools-version=v1.57

      - name: Artifact is SBPFv3
        run: bash deploy-scripts/assert-sbpf-version.sh target/deploy/velocity.so

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: target/deploy/velocity.so

  # Docker image build checks: build every shipped image the same way the
  # docker-on-tag release workflow does (same Dockerfiles + build-args from
  # docker-info.json), but with push: false — just prove they build clean.
  # Path-gated: TS images only when TS/workspace changes, rust images only when
  # the rust workspace / program changes. type=gha layer cache keeps reruns cheap.
  # TS images additionally skip a version-bump-only PR (see `version_only` in
  # the changes job). A bumped `version` field cannot change what an image builds.
  docker-images-ts:
    name: Docker build (ts)
    needs: changes
    if: ${{ needs.changes.outputs.docker_ts == 'true' && needs.changes.outputs.version_only != 'true' }}
    runs-on: ubicloud
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              app: dlob-server,
              path: apps/dlob-server,
              scope: '@velocity-exchange/dlob-server',
              out: lib,
              start: lib/index.js,
            }
          - {
              app: keeper-bots-v2,
              path: apps/keeper-bots-v2,
              scope: '@velocity-exchange/keeper-bots-v2',
              out: lib,
              start: lib/index.js,
            }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/ts-app.Dockerfile
          push: false
          build-args: |
            APP_PATH=${{ matrix.path }}
            APP_SCOPE=${{ matrix.scope }}
            APP_OUT=${{ matrix.out }}
            APP_START=${{ matrix.start }}
          cache-from: type=gha,scope=docker-ts-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=docker-ts-${{ matrix.app }}
  docker-images-rust:
    name: Docker build (rust)
    needs: changes
    if: ${{ needs.changes.outputs.docker_rust == 'true' }}
    runs-on: ubicloud
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: keep-rs, bin: keeprs }
          - { app: swift, bin: swift-server }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/rust-app.Dockerfile
          push: false
          build-args: |
            APP_BIN=${{ matrix.bin }}
          cache-from: type=gha,scope=docker-rust-${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=docker-rust-${{ matrix.bin }}

  # Single required status check. The heavy jobs above are path-gated, so on a
  # docs/TS-only PR they report "skipped" — and GitHub branch protection treats a
  # skipped *required* check as "not passed", which would block the merge forever.
  # Make THIS the only required check instead: it always runs and passes as long
  # as no upstream job actually failed or was cancelled (skipped is fine).
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - changes
      - fmt-clippy
      - unit-tests
      - integration-tests
      - prettier
      - lint
      - ts-build
      - ts-tests
      - sdk-tests
      - sdk-typecheck
      - rust-workspace-check
      - anchor-tests
      - vault-tests
      - verified-build
      - docker-images-ts
      - docker-images-rust
      - cargo-audit
      - cargo-deny
    runs-on: ubicloud
    steps:
      - name: Require upstream jobs to have succeeded or been skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not succeed (result=$r)."
              exit 1
            fi
          done
          echo "All upstream jobs succeeded or were skipped."
