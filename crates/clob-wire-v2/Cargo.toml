[package]
name = "clob-wire-v2"
description = "clob-wire compiled against anchor v2 (fork) for the CLOB IDL. Shared source with clob-wire via include!; one anchor per crate."
version = "0.1.0"
edition = "2021"
[dependencies]
quoter-spec = { package = "quoter-spec-v2", path = "../quoter-spec-v2" }
solana-address = { version = "~2.7", features = ["bytemuck", "copy", "wincode"] }
wincode = { version = "0.6", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
anchor-lang-v2 = { package = "anchor-lang", git = "https://github.com/velocity-exchange/anchor.git", rev = "444c6205fd3aa54006cf9d0c232d43471b74b071", optional = true }
[features]
default = []
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build", "quoter-spec/idl-build-v2"]
[lints.rust.unexpected_cfgs]
level = "allow"
