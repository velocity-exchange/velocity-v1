[package]
name = "quoter-spec"
description = "Wire format for velocity's quoter interface: the contract between the router and any program registered as a quoter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/velocity-exchange/velocity-v1/crates/quoter-spec/"

[dependencies]
# The address type every program on this wire already has. Velocity reaches it
# as `Pubkey` — solana-pubkey re-exports `Address as Pubkey`, and solana-address
# 1.x is a ten-line shim over 2.x — and the v2 programs reach it as `Address`
# through anchor-lang-v2 and pinocchio. Same struct, same major, so the types
# below can be the declaration both sides use rather than a shape they restate.
# `copy` is not optional: these are small value types that every caller moves
# by copy, and `Address` gates its `Copy` impl behind that feature.
solana-address = { version = "2", features = ["copy"] }

# Serialization is per-consumer, because the two halves of the wire do not agree
# on a framework: velocity decodes the response with borsh, and the v2 programs
# write the bytes themselves and must not be handed a borsh dependency (the
# CLOB's binary size and CU budget are why it has none). `Address` already
# carries both derives behind its own features, and both are already enabled in
# their respective trees, so neither feature below adds anything to either
# dependency graph.
# Optional, and only for velocity: anchor's derives are borsh's plus the
# `IdlBuild` plumbing `anchor idl build` needs on every type reachable from an
# instruction. A consumer that never runs the IDL build still wants the
# serialization, so the derive and the IDL support are separate features — and
# the v2 programs enable neither, so no anchor code reaches them.
anchor-lang = { version = "1.0.2", optional = true }
wincode = { version = "0.5", features = ["derive"], optional = true }

[features]
default = []
anchor-derive = ["dep:anchor-lang", "solana-address/borsh"]
idl-build = ["anchor-derive", "anchor-lang/idl-build"]
wincode-derive = ["dep:wincode", "solana-address/wincode"]
