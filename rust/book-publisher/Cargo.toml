[package]
name = "book-publisher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Quote-view assembly + decoding over a chain source.
velocity-router-sim = { path = "../router-sim" }
relay-chain-source = { git = "https://github.com/velocity-exchange/relay", rev = "4b4e80d27e49e18247218b2f570ee902788833b5" }
program = { package = "velocity", path = "../../programs/velocity", default-features = false, features = [
  "velocity-rs",
  "mainnet-beta",
  "cpi",
  "isolated-position",
  "vlp-hedge",
] }

anchor-lang = "1.0.2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
redis = { version = "0.29.1", features = ["tokio-comp", "tokio-native-tls-comp"] }
serde_json = "1"
solana-sdk = "3"
solana-rent = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
