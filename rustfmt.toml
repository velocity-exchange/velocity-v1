# Merge all `use` items in a module into a single `use { ... }` block.
# Both options are nightly-only: format with `cargo +nightly fmt`. Stable
# rustfmt ignores them (with a warning) and will not produce this style.
imports_granularity = "One"
group_imports = "One"

# velocity_idl.rs is generated by velocity-idl-gen, which pipes the output
# through the default-toolchain (stable) rustfmt; keep the committed file
# stable-formatted so regeneration does not rewrite it. Vendored crates keep
# upstream formatting.
ignore = [
    "rust/velocity-rs/crates/src/velocity_idl.rs",
    "rust/keep-rs/vendor",
]
