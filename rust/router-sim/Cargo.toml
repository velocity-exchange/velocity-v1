[package]
name = "velocity-router-sim"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Chain access + in-process simulation, extracted from relay's crank turner.
# Pinned by rev rather than tracking a branch: this crate decides what a fill
# would do, so the simulation layer under it should only move deliberately.
relay-chain-source = { git = "https://github.com/velocity-exchange/relay", rev = "a6c958b" }
# The program as a host library, same flavor velocity-rs uses — so account
# layout constants are derived from the struct rather than transcribed.
program = { package = "velocity", path = "../../programs/velocity", default-features = false, features = [
  "velocity-rs",
  "mainnet-beta",
  "cpi",
  "isolated-position",
  "vlp-hedge",
] }
# The health layer is a leaf with no chain access, so depending on it here
# keeps the attribute-and-retry loop in the router library every consumer
# already uses, rather than in each service.
velocity-quoter-health = { path = "../quoter-health" }
anchor-lang = "1.0.2"
bytemuck = "1"
solana-system-interface = "3"
anyhow = "1"
async-trait = "0.1"
solana-sdk = "3"
# The account type relay-chain-source hands back. That crate is on the solana
# 4.x line while this workspace stays on 3.x, because anchor 1.0 needs
# solana-program 3. Naming the 4.x `Account` here keeps the mismatch at this
# one boundary instead of converting every simulation result.
solana-account = "4"
# Same boundary: chain-source takes a 4.x `VersionedTransaction`.
solana-transaction = { version = "4", features = ["serde"] }
bincode = "1"
tracing = "0.1"

[dev-dependencies]
# Only to pin the deploy-record layout the health watcher reads by offset.
solana-loader-v3-interface = { version = "*", features = ["bincode"] }
bincode = "1"
solana-sdk-ids = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
