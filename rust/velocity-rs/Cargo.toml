[package]
name = "velocity-rs"
version = "1.0.1"
edition = "2021"
build = "build.rs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/velocity-exchange/velocity-v1"
homepage = "https://velocity.exchange"
description = """
Rust SDK for Velocity Protocol on the Solana blockchain.
"""
categories = ["cryptography::cryptocurrencies", "api-bindings"]
keywords = ["solana", "dex", "velocity", "sdk"]

[lib]
path = "crates/src/lib.rs"

[features]
# run integration tests against RPC nodes
rpc_tests = []
# make more variables public - use with caution
unsafe_pub = []
titan = ["titan-swap-api-client"]
# enable order event recording in DLOB
dlob_dbg = [] 

[dependencies]
ahash = "0.8.12"
anchor-lang = { version = "1.0.0", features = ["derive"] }
arc-swap = "1.7"
program = { package = "velocity", path = "../../programs/velocity", default-features = false, features = ["velocity-rs", "mainnet-beta", "cpi", "isolated-position", "vlp-hedge"] }
arrayvec = "0.7.6"
base64 = "0.22"
bytemuck = "1.17"
crossbeam = "0.8.4"
dashmap = "6"
env_logger = "0.11"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
regex = "1.10"
reqwest = { version = "0.12", features = ["json"] }
# rustc-hash replaces fxhash (RUSTSEC-2025-0057, unmaintained). Same FxHash
# family, and already in the lockfile transitively.
rustc-hash = "2.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder-client-types = "4.2.2"
solana-account = "4.3"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-ed25519-program = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4.2.3"
solana-pubkey = "4.2"
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-signature = "3"
solana-signer = "3"
# rpc-client 4.2.2 requires transaction >=4.1.4, <4.2.0
solana-transaction = "4.1.4"
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
spl-associated-token-account = { version = "8.0", default-features = false, features = ["no-entrypoint"] }
thiserror = "1"
titan-swap-api-client = { git = "https://github.com/velocity-exchange/titan-swap-api-client.git", rev = "9ef7df6753c6378d5ed0f2cfdeb44b66d2669632", optional = true }
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
# 13.5 / 12.7 are the 2026-08-29 pair; proto 12.6.0 is the first with
# transaction v1 (Message.config field 7). Client 13.x depends on proto 12.x
# and solana-pubkey ^4.1.
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"
velocity-pubsub-client = { version = "0.1.1", path = "crates/pubsub-client" }

[dev-dependencies]
bs58 = { version = "0.5.1", default-features = false }
bytes = "1"
hex-literal = "0.4"
nanoid = "0.4.0"
solana-account-decoder = "4.2.2"
solana-signature = { version = "3", features = ["rand"] }
toml = "0.8"

[build-dependencies]
velocity-idl-gen = { version = "0.2", path = "crates/velocity-idl-gen" }
