[package]
name = "e2e_svm_fuzz"
version = "0.1.0"
edition = "2021"

# Standalone workspace — isolated from the parent project to avoid Solana
# version conflicts (Crucible's harness model).
[workspace]

[dependencies]
# Crucible framework, pinned to the exact commit.
crucible-fuzzer = { git = "https://github.com/asymmetric-research/crucible", rev = "086b423506bf4928a878f292e34c7beed9c7056d" }
crucible-test-context = { git = "https://github.com/asymmetric-research/crucible", rev = "086b423506bf4928a878f292e34c7beed9c7056d" }
crucible-idl-gen = { git = "https://github.com/asymmetric-research/crucible", rev = "086b423506bf4928a878f292e34c7beed9c7056d" }

# velocity as a HOST library — same feature set as build-devnet.sh so the host
# structs match the loaded .so layout. Used for zero-copy account reads.
velocity = { path = "../../programs/velocity", default-features = false, features = [
  "no-entrypoint",
  "isolated-position",
  "vlp-hedge",
  "fuzz-fixtures",
] }
velocity-fuzz-common = { path = "../velocity-fuzz-common", features = ["clob"] }
# The CLOB market account's node layout, so the reservation invariant reads the
# book's own orders rather than the harness's record of them.
clob-state = { path = "../../crates/clob-state" }

# Same crate velocity itself verifies Lazer messages with. Used to BUILD the
# signed price update (`SolanaMessage` envelope + LE payload) so the harness
# drives the real `update_pyth_lazer_oracle` path instead of only poking the
# oracle account host-side.
pyth_lazer = { path = "../../programs/pyth-lazer", features = ["no-entrypoint"] }

# Not used directly — declared to turn ON litesvm's `precompiles` feature via
# cargo feature unification, which crucible-test-context does not enable.
# Without it the native Ed25519Program is simply absent from the VM and any
# transaction referencing it dies with `InvalidProgramForExecution`, so the
# whole signed-message ("swift") order surface is unreachable.
# The `=` pin is required, not stylistic: crucible pins litesvm exactly, and a
# caret range here resolves a SECOND litesvm whose feature set is unified
# separately — the precompiles never reach the VM crucible actually builds.
# Keep this version identical to crucible's own pin.
litesvm = { version = "=0.15.2", features = ["precompiles"] }

anchor-lang = "1.0"
anyhow = "1"
arbitrary = { version = "1", features = ["derive"] }
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
ctrlc = "3.4"
ctor = "0.6"
solana-pubkey = "3.0"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-instruction = "3.0"
bytemuck = "1.14"
# Byte-order writer for the Lazer payload (LE), matching pyth_lazer's own encoder.
byteorder = "1.4"

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
# One entry per fuzz test; `crucible run e2e-svm <name>` builds --features <name>.

# --- Phase 1/2: always-on invariant harness ---
invariant_solvency = []

# --- Phase 3: regression harnesses (pending audit-fix PRs) ---
# Off by default so the standard lane stays green on master.
#
# IMPLEMENTED — reproduces on current (pre-fix) master:
#   PR #270 (OtterSec F1): the market-scoped SettlePnl pause is not enforced on
#   the expired-position settle path. Run:
#     crucible run e2e-svm regr_270_perp_pause --timeout 10
regr_270_perp_pause = []
#
# DEFERRED — see the module-level "Deferred regressions" note in src/main.rs.
# Each needs coherent state that is impractical to inject in this tier's budget
# (signed-message envelopes, RevenueShareEscrow + approved-builder rows,
# borrow/utilization so interest actually accrues, or the fill/matching engine).
# These are better homed in P8 (e2e-svm-liq) or a dedicated escrow harness.
#   regr_256_builder_fee, regr_273_revenue_share_subaccount,
#   regr_271_signed_msg_pause, regr_272_deposit_withdraw_pause,
#   regr_276_funding_pause
