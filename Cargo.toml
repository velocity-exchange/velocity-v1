[workspace]
members = [
	"programs/velocity",
	"programs/vaults",
	"programs/jit-proxy",
	"programs/pyth",
	"programs/pyth-lazer",
	"programs/token_faucet",
	"programs/protocol-revenue-router",
	"crates/velocity-macros",
]
# The `rust/` directory is a SEPARATE Cargo workspace (velocity-rs/keep-rs/swift).
# It is excluded here so its split solana 4.2 crate tree never unifies with
# the program (SBF) build, and so the two workspaces don't collide as nested
# workspace roots. See rust/Cargo.toml.
# `fuzz/` is likewise excluded for the same reasons (Crucible/LibAFL/LiteSVM host
# fuzz harnesses). Each `fuzz/<crate>/` is its own standalone workspace (there is
# no `fuzz/Cargo.toml` root) so their solana-sdk 3.x / libafl trees never unify
# with the program (SBF) build; see fuzz/README.md.
exclude = ["rust", "fuzz", "programs/protocol-revenue-router/svm-tests"]
resolver = "2"

# Shared by every program crate through `[lints] workspace = true`. `solana_program::entrypoint!`
# and Anchor's macros check these cfgs inside the calling crate. Declaring them keeps the lint on
# for real typos without adding features that would change the build if someone enabled them.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-log-ix-name"))',
] }

# Anchor's `#[program]` emits a `let _: T = panic!()` type check per instruction argument at the
# crate root, outside any item a crate can annotate.
[workspace.lints.clippy]
diverging_sub_expression = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
