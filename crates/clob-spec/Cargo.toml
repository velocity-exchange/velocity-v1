[package]
name = "clob-spec"
description = "Layout of the CLOB market account: the one declaration the book and its readers share"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/velocity-exchange/velocity-v1/crates/clob-spec/"

[dependencies]
# The node's user identity and the book's sides, from the crate that already
# declares every shape the two programs exchange.
quoter-spec = { path = "../quoter-spec" }
# The node is cast out of account bytes at both ends, so it is `Pod`. The
# derive is also the layout check: a field reordered into a padding hole stops
# compiling here rather than changing what a reader sees.
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
solana-address = { version = "~2.6", features = ["bytemuck", "copy"] }
static_assertions = "1.1.0"
