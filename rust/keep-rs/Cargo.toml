[package]
name = "keeprs"
version = "0.1.7"
edition = "2021"
description = "Rust keeper bots for Velocity protocol"
license = "MIT"
repository = "https://github.com/velocity-exchange/velocity-v1"
keywords = ["velocity", "defi", "solana", "trading-bot", "liquidity"]
categories = ["financial", "network-programming"]

[dependencies]
anchor-lang = "1.0"
axum = "0.8"
clap = { version = "4.5.40", "features" = ["env", "derive"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
dotenv = "0.15.0"
velocity-rs = { path = "../velocity-rs", features = ["unsafe_pub", "titan"] }
# Simulation lives here, and asking a book who rests on it is a simulation.
velocity-router-sim = { path = "../router-sim" }
relay-chain-source = { git = "https://github.com/velocity-exchange/relay", rev = "e4b1115" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Program internals are reached via `velocity_rs::program::…`; no direct path-dep on
# the velocity program. velocity-rs pulls it with `cpi` (⊇ `no-entrypoint`).
env_logger = "0.11"
# DLOB 'trace' logs are expensive so compile them out
log = { version = "0.4", features = ["max_level_trace"] }
futures-util = "0.3.31"
mimalloc = "0.1.47"
# default-features = false drops prometheus's only default feature, `protobuf`,
# which pulls protobuf 2.x (RUSTSEC-2024-0437, no fix on the 2.x line). Only the
# text encoder is used here, so the protobuf encoder is dead weight.
velocity-quoter-health = { path = "../quoter-health" }
prometheus = { version = "0.13.4", default-features = false }
pyth-lazer-client = "0.1.3"
pyth-lazer-protocol = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-account = "4.3"
# The crate is `#![cfg(feature = "agave-unstable-api")]` and gates Base64Zstd
# decoding behind `zstd`; both arrive only via solana-rpc-client today. Declared
# here so losing that edge is a resolution error, not accounts silently
# decoding to `None`.
solana-account-decoder-client-types = { version = "4.2.2", features = ["agave-unstable-api", "zstd"] }
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-clock = "3"
solana-instruction = "3"
solana-pubkey = "4.2"
solana-signature = "3"
solana-transaction = "4.1.4"
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
tokio = "1.48"
dashmap = "6.1.0"

[dev-dependencies]
byteorder = "1.5"

[[bin]]
name = "tx_history"
path = "src/tx_history.rs"

# NOTE: [patch.crates-io] (pyth-lazer-protocol = vendor/pyth-lazer-protocol) is
# hoisted to the rust/ workspace root Cargo.toml — Cargo only honors patches at
# the workspace root.
