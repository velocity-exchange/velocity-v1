[package]
name = "clob-state-v2"
description = "clob-state compiled against anchor v2 for the CLOB IDL. Shared source via include!."
version = "0.1.0"
edition = "2021"
[dependencies]
quoter-spec = { package = "quoter-spec-v2", path = "../quoter-spec-v2" }
bytemuck = { version = "1.14", features = ["derive"] }
solana-address = { version = "2.6", features = ["bytemuck", "copy"] }
anchor-lang-v2 = { package = "anchor-lang", git = "https://github.com/velocity-exchange/anchor.git", rev = "b005890d9351a17a8061811662c44d781a04baf0", optional = true }
[features]
default = []
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build", "quoter-spec/idl-build-v2"]
[lints.rust.unexpected_cfgs]
level = "allow"
