# Nightly (and on-demand) Crucible fuzzing campaigns.
#
# NON-GATING by design: this never runs on pull_request, and every fuzzing step
# is continue-on-error, so a discovered crash surfaces as an uploaded artifact +
# a job-summary line rather than a red required check. A fuzzer is a discovery
# tool, not a pass/fail gate — "green" here means "the campaign ran to
# completion", and any findings are reported, not merge-blocking.
#
# It runs the INVARIANT harnesses (the open-ended discovery surface), not the
# regr_* regression harnesses (those crash by design on pre-fix master and are
# covered by the fuzz-build compile gate + manual reproduction).
name: fuzz-nightly

on:
  # TEMPORARY (removed before merge): lets us exercise this workflow on the
  # feature branch, since workflow_dispatch/schedule only register from the
  # default branch. On a push event the inputs are empty → the env defaults
  # (30 min, both tiers) apply.
  push:
    branches: [feat/crucible]
    paths: ['.github/workflows/fuzz-nightly.yml']
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Fuzz budget per crate (minutes)'
        required: false
        default: '30'
      tier:
        description: 'Which tier(s) to run'
        required: false
        default: 'both'
        type: choice
        options: [host, svm, both]

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.91.1
  ANCHOR_VERSION: 1.0.2
  SOLANA_VERSION: 2.3.11
  NODE_VERSION: '24.x.x'
  DO_NOT_TRACK: 1
  CARGO_INCREMENTAL: 0
  # velocity's native entrypoint is emitted for host linking (cfg'd on not(cpi));
  # let the harness binary keep one copy of the duplicate `entrypoint` symbol.
  RUSTFLAGS: "-C link-arg=-Wl,--allow-multiple-definition"
  DURATION: ${{ github.event.inputs.duration_minutes || '30' }}
  TIER: ${{ github.event.inputs.tier || 'both' }}

defaults:
  run:
    shell: bash

jobs:
  # ---- Host tier: pure-math invariant fuzzing (no .so, ~1.1k exec/s) ----------
  nightly-host:
    name: fuzz ${{ matrix.crate }} (host)
    if: ${{ (github.event.inputs.tier || 'both') != 'svm' }}
    runs-on: ubicloud
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: [margin-liq, amm-pricing, funding, fees-if-bankruptcy, spot, orders-matching, oracle]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
          override: true

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: fuzz/${{ matrix.crate }}

      - name: Install crucible CLI (pinned)
        run: cargo install --git https://github.com/asymmetric-research/crucible --rev daeaa4d4a4e334175c4f171daacc7e177ad2fae0 crucible-fuzz-cli --locked || cargo install --git https://github.com/asymmetric-research/crucible --rev daeaa4d4a4e334175c4f171daacc7e177ad2fae0 crucible-fuzz-cli

      - name: Fuzz invariant harnesses
        continue-on-error: true
        run: |
          set -uo pipefail
          c="${{ matrix.crate }}"
          # invariant features only (exclude regr_* regressions)
          feats=$(grep -oE '^[a-zA-Z0-9_]+ = \[\]' "fuzz/$c/Cargo.toml" | sed 's/ .*//' | grep -vE '^regr_' || true)
          n=$(echo "$feats" | grep -c . || echo 1); [ "$n" -gt 0 ] || n=1
          per=$(( DURATION * 60 / n )); [ "$per" -ge 60 ] || per=60
          echo "## $c — $n invariant harness(es), ${per}s each" >> "$GITHUB_STEP_SUMMARY"
          for f in $feats; do
            echo "::group::crucible run $c $f (${per}s)"
            crucible run "$c" "$f" --timeout "$per" 2>&1 | tail -20 || echo "run $f exited nonzero"
            echo "::endgroup::"
          done

      - name: Collect findings
        if: ${{ always() }}
        run: |
          # No grep in the pipeline: under `bash -e -o pipefail` a no-match grep
          # exits 1 and would fail this step on a clean (0-crash) run. `find`
          # with `! -name` excludes the .meta.json sidecars and exits 0 on empty.
          crashes=$(find "fuzz/${{ matrix.crate }}" -path '*/crashes/*' -type f ! -name '*.meta.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "**${{ matrix.crate }}: ${crashes:-0} crash input(s) found**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${crashes:-0}" != "0" ]; then
            find "fuzz/${{ matrix.crate }}" -path '*/crashes/*' -type f ! -name '*.meta.json' | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload crash corpus
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crashes-host-${{ matrix.crate }}
          path: fuzz/${{ matrix.crate }}/crashes/
          if-no-files-found: ignore

  # ---- SVM tier: coverage-guided invariant fuzzing on the .so (best-effort) ---
  # Builds the anchor-test-flavored .so (isolated-position + vlp-hedge live), then
  # fuzzes the global-solvency invariants. continue-on-error at the job level so a
  # slow/failed toolchain setup never turns the workflow red.
  nightly-svm:
    name: fuzz SVM invariants (best-effort)
    if: ${{ (github.event.inputs.tier || 'both') != 'host' }}
    runs-on: ubicloud
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          components: rustfmt
          override: true

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            .
            fuzz/e2e-svm
            fuzz/e2e-svm-liq

      - name: Setup Solana
        uses: ./.github/actions/setup-solana/

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} avm --locked --force
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}

      - name: Setup node + bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build program (.so, anchor-test flavor)
        env:
          CARGO_PROFILE_RELEASE_LTO: 'thin'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          # Clear the host-link RUSTFLAGS: the SBF build invokes rust-lld directly
          # and rejects the cc-style `-Wl,--allow-multiple-definition` (that flag
          # is only for the host harness *binary* link, not the on-chain .so).
          RUSTFLAGS: ''
        run: |
          rm -rf target/sbpf-solana-solana target/deploy
          anchor build --ignore-keys --skip-lint -- --features anchor-test
          ls -la target/deploy/velocity.so

      - name: Install crucible CLI (pinned)
        run: cargo install --git https://github.com/asymmetric-research/crucible --rev daeaa4d4a4e334175c4f171daacc7e177ad2fae0 crucible-fuzz-cli --locked || cargo install --git https://github.com/asymmetric-research/crucible --rev daeaa4d4a4e334175c4f171daacc7e177ad2fae0 crucible-fuzz-cli

      - name: Fuzz SVM invariants
        continue-on-error: true
        run: |
          set -uo pipefail
          # SVM exec is slow (~60/s) and the .so build already dominates; cap the
          # per-harness budget (max 10 min each) so the job finishes in good time.
          per=$(( DURATION * 60 )); [ "$per" -le 600 ] || per=600; [ "$per" -ge 120 ] || per=120
          for pair in "e2e-svm:invariant_solvency" "e2e-svm-liq:invariant_liq"; do
            c="${pair%%:*}"; f="${pair##*:}"
            echo "::group::crucible run $c $f (${per}s)"
            crucible run "$c" "$f" --timeout "$per" 2>&1 | tail -30 || echo "run $c/$f exited nonzero"
            echo "::endgroup::"
            echo "## SVM $c/$f ran ${per}s" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Collect + upload findings
        if: ${{ always() }}
        run: |
          for c in e2e-svm e2e-svm-liq; do
            n=$(find "fuzz/$c" -path '*/crashes/*' -type f ! -name '*.meta.json' 2>/dev/null | wc -l | tr -d ' ')
            echo "**$c: ${n:-0} crash input(s)**" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload SVM crash corpus
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crashes-svm
          path: |
            fuzz/e2e-svm/crashes/
            fuzz/e2e-svm-liq/crashes/
          if-no-files-found: ignore
