name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: "24.x.x"

jobs:
  # ---------------------------------------------------------------------------
  # 1. release-please: parses Conventional Commits since the last release tag.
  #
  #    On every push to master it either opens / updates a "release PR" (which
  #    bumps versions, regenerates CHANGELOGs, and updates the manifest) or, if
  #    the most recent push was the merge of a release PR, creates Git tags +
  #    GitHub Releases and exports `<component>--release_created` outputs that
  #    gate the publish jobs below.
  # ---------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      sdk_released: ${{ steps.release.outputs['sdk--release_created'] }}
      sdk_tag: ${{ steps.release.outputs['sdk--tag_name'] }}
      sdk_version: ${{ steps.release.outputs['sdk--version'] }}
      cli_admin_released: ${{ steps.release.outputs['cli-admin--release_created'] }}
      cli_admin_tag: ${{ steps.release.outputs['cli-admin--tag_name'] }}
      cli_admin_version: ${{ steps.release.outputs['cli-admin--version'] }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4
        id: release
        with:
          # Default GITHUB_TOKEN is fine — release-please opens PRs from a branch
          # it owns and doesn't push directly to master, so the ruleset is happy.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # 2. Publish @velocity-exchange/sdk (node) + @velocity-exchange/sdk-browser.
  #    Runs only when release-please cut a tag for the `sdk` component.
  # ---------------------------------------------------------------------------
  publish-sdk:
    needs: release-please
    if: needs.release-please.outputs.sdk_released == 'true'
    runs-on: ubicloud
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC token exchange)
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.sdk_tag }}
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.14.1
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish node build to npm
        # OIDC trusted publishing (--provenance is implicit). Tag inferred from
        # the version: prerelease versions (containing a `-`) ship as `beta`,
        # otherwise `latest`.
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access=public --tag beta
          else
            npm publish --access=public
          fi
      - name: Build browser bundle
        run: |
          bun run build:browser
          node -e "const p=require('./package.json'); p.name=p.name+'-browser'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2));"
      - name: Publish browser build to npm
        # Requires a separate Trusted Publisher entry on npmjs.com for
        # @velocity-exchange/sdk-browser pointing at this workflow + job.
        env:
          VERSION: ${{ needs.release-please.outputs.sdk_version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access=public --tag beta
          else
            npm publish --access=public
          fi
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "#code-review"
          slack-message: "<!here> ❌ SDK publish failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------------------
  # 3. Publish @velocity-exchange/admin-cli. Depends on publish-sdk so the SDK
  #    version it pins resolves on npm. `always()` + result guards let this run
  #    when the SDK wasn't part of this release.
  # ---------------------------------------------------------------------------
  publish-cli-admin:
    needs: [release-please, publish-sdk]
    if: |
      always() &&
      needs.release-please.outputs.cli_admin_released == 'true' &&
      (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped')
    runs-on: ubicloud
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./cli-admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.cli_admin_tag }}
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.14.1
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install + build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Pin @velocity-exchange/sdk dep + publish
        # prepare-publish rewrites file:../sdk to a real semver before publish;
        # restore-publish puts the file:.. back so the local checkout matches
        # the committed state. Authenticates via OIDC trusted publishing.
        env:
          VERSION: ${{ needs.release-please.outputs.cli_admin_version }}
        run: |
          bun run prepare-publish
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access=public --tag beta
            status=$?
          else
            npm publish --access=public
            status=$?
          fi
          bun run restore-publish
          exit $status
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "#code-review"
          slack-message: "<!here> ❌ cli-admin publish failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------------------
  # 4. Fan out repository_dispatch events to downstream consumers of the SDK.
  #    Mirrors the previous `emit-dispatch-events` job in main.yml.
  # ---------------------------------------------------------------------------
  emit-dispatch-events:
    needs: [release-please, publish-sdk]
    if: needs.release-please.outputs.sdk_released == 'true' && needs.publish-sdk.result == 'success'
    runs-on: ubicloud
    strategy:
      matrix:
        repo:
          - jit-proxy
          - dlob-server
          - drift-vaults
          - drift-common
          - drift-ffi-sys
          - drift-rs
          - swift
    steps:
      - name: Emit dispatch event
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.release-please.outputs.sdk_version }}
          REPO: ${{ matrix.repo }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/drift-labs/$REPO/dispatches" \
            -d "{\"event_type\": \"sdk-update\", \"client_payload\": { \"version\": \"$VERSION\" }}"
