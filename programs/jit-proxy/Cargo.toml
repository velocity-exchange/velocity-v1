[package]
name = "jit-proxy"
version = "0.21.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jit_proxy"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
# no-op flag: the workspace `anchor build -- --features anchor-test` passes this
# to every program; jit-proxy has no test-gated code but must accept the feature.
anchor-test = []
default = []
idl-build = ["anchor-lang/idl-build", "velocity/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
velocity = { path = "../velocity", default-features = false, features = ["cpi"] }
