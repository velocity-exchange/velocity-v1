[package]
name = "velocity-pubsub-client"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/velocity-exchange/velocity-v1"
description = "Solana Pubsub Client patched with proper connection handling"

[dependencies]
futures-util = "0.3"
gjson = "0.8.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The crate is `#![cfg(feature = "agave-unstable-api")]` and gates Base64Zstd
# decoding behind `zstd`; both arrive only via solana-rpc-client today. Declared
# here so losing that edge is a resolution error, not accounts silently
# decoding to `None`.
solana-account-decoder-client-types = { version = "4.2.2", features = ["agave-unstable-api", "zstd"] }
solana-clock = "3"
solana-pubkey = "4.2"
solana-signature = "3"
solana-rpc-client-api = "4.2"
thiserror = "1"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
url = "2.5"