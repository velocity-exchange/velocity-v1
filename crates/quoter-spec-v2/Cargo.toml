[package]
name = "quoter-spec-v2"
description = "quoter-spec wire types compiled against the velocity anchor v2 fork, for the CLOB/midpoint IDL. Same source as quoter-spec (via include!), one anchor per crate so v1 and v2 never collide."
version = "0.1.0"
edition = "2021"
[dependencies]
solana-address.workspace = true
wincode.workspace = true
bytemuck.workspace = true
anchor-lang-v2 = { package = "anchor-lang", git = "https://github.com/otter-sec/anchor.git", rev = "abacd0e9362d957e7da779fa81b1a10dd9480b28", optional = true }
[features]
default = []
idl-build = []
idl-build-v2 = ["dep:anchor-lang-v2", "idl-build"]
[lints.rust.unexpected_cfgs]
level = "allow"
