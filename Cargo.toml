[workspace]
members = [
	"programs/velocity",
	"programs/vaults",
	"programs/jit-proxy",
	"programs/pyth",
	"programs/pyth-lazer",
	"programs/token_faucet",
	"crates/velocity-macros",
]
# The `rust/` directory is a SEPARATE Cargo workspace (velocity-rs/keep-rs/swift).
# It is excluded here so its solana-sdk 3.x dependency tree never unifies with
# the program (SBF) build, and so the two workspaces don't collide as nested
# workspace roots. See rust/Cargo.toml.
# `fuzz/` is likewise a SEPARATE workspace (Crucible/LibAFL/LiteSVM host fuzz
# harnesses) — excluded for the same reasons; see fuzz/Cargo.toml.
exclude = ["rust", "fuzz"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
