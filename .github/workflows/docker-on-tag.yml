name: docker-on-tag

# Push a tag `docker-<app>-v<version>` to build + push that app's image to ECR.
# `<app>` is a key in docker-info.json (e.g. docker-dlob-server-v0.3.0,
# docker-keeper-bots-v2-v1.4.2, docker-keep-rs-v2.1.0). The version is everything
# after the LAST `-v`, so app keys may themselves contain `-v` (keeper-bots-v2).
#
# Each pushed image gets a GitHub build-provenance attestation over its digest,
# binding it to this workflow and commit. After an ECR login, verify with:
#
#   gh attestation verify oci://<registry>/<repo>:<version> \
#     -R velocity-exchange/protocol-v2-shadow
#
# The attestation lives on GitHub and is deliberately NOT pushed to the registry.
# buildx's own `provenance: true` (and cosign-style in-registry signatures) wrap
# the image in an OCI index with an in-toto manifest beside it, which ECR rejects
# during the imagetools copy below — that is what left vamm-crank v0.2.2's prod
# tag pointing at a 1.8KB attestation manifest instead of the image.
on:
  push:
    tags:
      - 'docker-*'

permissions:
  id-token: write
  contents: read
  attestations: write # record the build-provenance attestation for each image digest

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      lang: ${{ steps.parse.outputs.lang }}
      path: ${{ steps.parse.outputs.path }}
      scope: ${{ steps.parse.outputs.scope }}
      out: ${{ steps.parse.outputs.out }}
      start: ${{ steps.parse.outputs.start }}
      bin: ${{ steps.parse.outputs.bin }}
      ecr: ${{ steps.parse.outputs.ecr }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          rest="${tag#docker-}"
          app="${rest%-v*}"          # strip the trailing -v<version>
          version="v${rest##*-v}"    # everything after the last -v
          echo "Parsed app=$app version=$version from tag=$tag"
          info=$(jq -e --arg a "$app" '.[$a]' docker-info.json) || { echo "::error::unknown app '$app' (no docker-info.json entry)"; exit 1; }
          {
            echo "app=$app"
            echo "version=$version"
            echo "lang=$(echo "$info" | jq -r '.lang')"
            echo "path=$(echo "$info" | jq -r '.path')"
            echo "scope=$(echo "$info" | jq -r '.scope // ""')"
            echo "out=$(echo "$info" | jq -r '.out // "dist"')"
            echo "start=$(echo "$info" | jq -r '.start // "dist/index.js"')"
            echo "bin=$(echo "$info" | jq -r '.bin // ""')"
            echo "ecr=$(echo "$info" | jq -r '.ecr')"
          } >> "$GITHUB_OUTPUT"

  build-ts:
    needs: route
    if: needs.route.outputs.lang == 'ts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Configure AWS credentials (non-prod)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v4
        with:
          role-to-assume: ${{ vars.VELOCITY_NON_PROD_ECR_PUBLISH_ROLE }}
          role-session-name: gha-docker-${{ github.run_id }}
          aws-region: eu-west-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/ts-app.Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
          # Same cache scope as main.yml's docker-images-ts job: a tag usually points
          # at a commit main CI just built, and with an identical scope the whole
          # build replays from the layer cache instead of rebuilding from scratch.
          cache-from: type=gha,scope=docker-ts-${{ needs.route.outputs.app }}
          cache-to: type=gha,mode=max,scope=docker-ts-${{ needs.route.outputs.app }}
          build-args: |
            APP_PATH=${{ needs.route.outputs.path }}
            APP_SCOPE=${{ needs.route.outputs.scope }}
            APP_OUT=${{ needs.route.outputs.out }}
            APP_START=${{ needs.route.outputs.start }}
      - name: Attest image provenance (non-prod)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}
          subject-digest: ${{ steps.build.outputs.digest }}
      # Copy the just-pushed image into prod ECR (account 039438368040). Assume the
      # prod publish role, log into prod ECR (its login persists alongside the non-prod
      # one in the docker config), then copy the manifest registry-to-registry with
      # imagetools — no rebuild. Set the VELOCITY_PROD_ECR_PUBLISH_ROLE repo var to the
      # prod role ARN; mirrors VELOCITY_NON_PROD_ECR_PUBLISH_ROLE above.
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v4
        with:
          role-to-assume: ${{ vars.VELOCITY_PROD_ECR_PUBLISH_ROLE }}
          role-session-name: gha-docker-prod-${{ github.run_id }}
          aws-region: eu-west-1
      - id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Copy image to prod ECR
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
      # infrastructure-v3 deploys from PROD ECR, so an attestation covering only
      # the non-prod digest would prove nothing about what actually runs.
      # imagetools should copy the manifest unchanged (same digest, already
      # attested above); if it ever rewraps, warn and attest the prod digest too
      # rather than failing a release that has already been pushed.
      - name: Resolve prod digest
        id: prod
        env:
          IMAGE: ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "prod digest: $digest (built: $BUILT)"
          if [ "$digest" != "$BUILT" ]; then
            echo "::warning::prod ECR digest ($digest) differs from the built digest ($BUILT) — imagetools rewrapped the manifest"
            echo "differs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance (prod)
        if: steps.prod.outputs.differs == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}
          subject-digest: ${{ steps.prod.outputs.digest }}

  build-rust:
    needs: route
    if: needs.route.outputs.lang == 'rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Configure AWS credentials (non-prod)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v4
        with:
          role-to-assume: ${{ vars.VELOCITY_NON_PROD_ECR_PUBLISH_ROLE }}
          role-session-name: gha-docker-${{ github.run_id }}
          aws-region: eu-west-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/rust-app.Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
          # Same cache scope as main.yml's docker-images-rust job (keyed by bin, not
          # app): a tag usually points at a commit main CI just built, and with an
          # identical scope the expensive `cargo build` layer replays from the layer
          # cache instead of recompiling the whole rust workspace. The GIT_SHA /
          # BUILD_VERSION build-args below don't hurt reuse — they're declared in the
          # runner stage only, after the builder layers.
          cache-from: type=gha,scope=docker-rust-${{ needs.route.outputs.bin }}
          cache-to: type=gha,mode=max,scope=docker-rust-${{ needs.route.outputs.bin }}
          build-args: |
            APP_BIN=${{ needs.route.outputs.bin }}
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=${{ needs.route.outputs.version }}
      - name: Attest image provenance (non-prod)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}
          subject-digest: ${{ steps.build.outputs.digest }}
      # Copy the just-pushed image into prod ECR (account 039438368040). See the
      # build-ts job for the rationale; set VELOCITY_PROD_ECR_PUBLISH_ROLE to enable.
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v4
        with:
          role-to-assume: ${{ vars.VELOCITY_PROD_ECR_PUBLISH_ROLE }}
          role-session-name: gha-docker-prod-${{ github.run_id }}
          aws-region: eu-west-1
      - id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Copy image to prod ECR
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
      # See the build-ts job for why the prod digest is checked and attested too.
      - name: Resolve prod digest
        id: prod
        env:
          IMAGE: ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}:${{ needs.route.outputs.version }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "prod digest: $digest (built: $BUILT)"
          if [ "$digest" != "$BUILT" ]; then
            echo "::warning::prod ECR digest ($digest) differs from the built digest ($BUILT) — imagetools rewrapped the manifest"
            echo "differs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance (prod)
        if: steps.prod.outputs.differs == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.login-ecr-prod.outputs.registry }}/${{ needs.route.outputs.ecr }}
          subject-digest: ${{ steps.prod.outputs.digest }}
