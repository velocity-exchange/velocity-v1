[package]
name = "midpoint"
version = "0.1.0"
description = "Velocity midpoint (spline) quoter program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "midpoint"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-log-ix-name = []
idl-build = ["quoter-spec/idl-build-v2"]
profile = ["anchor-v2-testing/profile"]

[dependencies]
# Anchor v2 alpha (anchor-next). Pinned to an exact rev — the alpha branch moves.
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", rev = "abacd0e9362d957e7da779fa81b1a10dd9480b28" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# The stack-buffer emit path both quoters use.
quoter-emit = { package = "quoter-emit-v2", path = "../../../crates/quoter-emit-v2" }
static_assertions = "1.1.0"
wincode = { version = "0.6", features = ["derive"] }
# Declares the quoter wire types this program writes. `wincode-derive` gives
# them the same derives the rest of this program's wire structs use. No borsh
# reaches this binary: the spec's anchor derives are behind a feature only
# velocity turns on.
quoter-spec = { package = "quoter-spec-v2", path = "../../../crates/quoter-spec-v2" }

[dev-dependencies]
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", rev = "abacd0e9362d957e7da779fa81b1a10dd9480b28" }
litesvm = "0.13.1"
quoter-test-support = { path = "../quoter-test-support" }
solana-clock = "3"
solana-pubkey = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
