# HTTP and websocket RPC on both 8899 and 8900. velocity-rs derives its
# websocket URL from the HTTP URL and keeps the port, as a hosted RPC expects.
# web3.js moves a local URL's websocket to the next port. Each port serves
# both, so each client finds pubsub where it looks.
upstream rpc_http { server validator:8899; }
upstream rpc_ws { server validator:8900; }

map $http_upgrade $rpc_backend {
  default rpc_http;
  websocket rpc_ws;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8899;
  listen 8900;

  location / {
    proxy_pass http://$rpc_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
    client_max_body_size 16m;
  }
}
