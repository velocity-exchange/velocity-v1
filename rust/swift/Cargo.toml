[package]
name = "swift-server"
version = "0.1.3"
edition = "2021"

[features]
# Live tests that need RPC-backed external state. Off by default so the offline
# PR gate (`cargo test --workspace`) skips them; the live CI job runs
# `cargo test --workspace --features rpc_tests` with the required secrets.
rpc_tests = []

[dependencies]
anyhow = "1.0.86"
arrayvec = "0.7.6"
anchor-lang = "1.0.0"
axum = { version = "^0.8.3", features = ["ws"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-prometheus = "0.7.0"
base64 = "0.22.1"
bincode = "1"
clap = { version = "4.0", features = ["derive"] }
dashmap = "6.1.0"
dotenv = "0.15.0"
velocity-rs = { path = "../velocity-rs" }
# Program internals are reached via `velocity_rs::program::…`; no direct path-dep on
# the velocity program. velocity-rs pulls it with `cpi`.
# `/route`: the same quote-view simulation the book-publisher runs, exposed
# as an HTTP endpoint.
velocity-router-sim = { path = "../router-sim" }
velocity-quoter-health = { path = "../quoter-health" }
relay-chain-source = { git = "https://github.com/velocity-exchange/relay", rev = "e4b1115" }
solana-account-info = "3.1"
solana-clock = "3"
ed25519-dalek = "1.0.1"
env_logger = "0.11"
faster-hex = "0.10.0"
futures-util = "0.3.30"
log = "0.4.22"
nanoid = "0.4.0"
# See the note in keep-rs/Cargo.toml: drops the `protobuf` default feature and
# with it protobuf 2.x (RUSTSEC-2024-0437).
prometheus = { version = "0.13", default-features = false }
rand = "0.8"
redis = { version = "0.29.1", features = ["tokio-comp", "tokio-native-tls-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.127"
# The crate is `#![cfg(feature = "agave-unstable-api")]` and gates Base64Zstd
# decoding behind `zstd`; both arrive only via solana-rpc-client today. Declared
# here so losing that edge is a resolution error, not accounts silently
# decoding to `None`.
solana-account-decoder-client-types = { version = "4.2.2", features = ["agave-unstable-api", "zstd"] }
solana-rpc-client-api = "4.2.2"
solana-pubkey = { version = "4.2", features = ["std"] }
solana-signature = { version = "3", features = ["rand"] }
solana-keypair = "3"
solana-signer = "3"
solana-hash = "4.4"
solana-instruction = "3"
solana-message = "4.2.3"
solana-transaction = { version = "4.1.4", features = ["verify"] }
solana-native-token = "3"
solana-system-interface = "3"
tokio = { version = "1.0", features = ["full"] }
# fork with Ws compression enabled
tokio-tungstenite = { git = "https://github.com/velocity-exchange/tokio-tungstenite", rev = "a7e7170090eebd2efe7c51fc81b727872ca7ea6c", features = ["native-tls"] }
urlencoding = "2.1.0"
uuid = { version = "1.10.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
tower-http = { version = "0.6.2", features= ["cors"] }
strum_macros = "0.27.0"
zstd = "0.13.3"

[dev-dependencies]
axum-macros = "0.4.2"

[profile.dev.package]
ring = { opt-level = 0 }
zstd-sys = { opt-level = 0 }
solana-program = { opt-level = 0 }
