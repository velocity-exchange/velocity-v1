[package]
name = "clob"
version = "0.1.0"
description = "Velocity CLOB quoter program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "clob"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-log-ix-name = []
idl-build = []
profile = ["anchor-v2-testing/profile"]

[dependencies]
# Anchor v2 alpha (anchor-next). Pinned to an exact rev — the alpha branch moves.
anchor-lang-v2 = { git = "https://github.com/velocity-exchange/anchor.git", rev = "a8e619f32fcfea63244bc84773edb8a3a6cc140c" }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
static_assertions = "1.1.0"
wincode = { version = "0.5", features = ["derive"] }
# Declares the quoter wire types this program writes. `wincode-derive` gives
# them the same derives the rest of this program's wire structs use. No borsh
# reaches this binary: the spec's anchor derives are behind a feature only
# velocity turns on.
quoter-spec = { path = "../../../crates/quoter-spec" }
clob-wire = { path = "../../../crates/clob-wire" }
# The relay condition block this market hosts. Expiry, activation, capacity and
# a crossed book are facts about this account, so the wakes that watch for them
# live on it. bytemuck-only, so no framework reaches this binary; the resolver
# each condition names is registered by the program that owns the book's flow.
relay-spec = { git = "https://github.com/velocity-exchange/relay", rev = "88419fd1de3ee189e44ef591d9e8f5c558d58a9d" }

[dev-dependencies]
# `testing` adds the stack-backed AccountBuffer the src/tests/ unit tests
# build a real ClobMarketV0 over. Dev-only: with resolver 2 the feature is
# not enabled for the SBF build of the program itself.
anchor-lang-v2 = { git = "https://github.com/velocity-exchange/anchor.git", rev = "a8e619f32fcfea63244bc84773edb8a3a6cc140c", features = [
    "testing",
] }
anchor-v2-testing = { git = "https://github.com/velocity-exchange/anchor.git", rev = "a8e619f32fcfea63244bc84773edb8a3a6cc140c" }
litesvm = "0.11.0"
solana-account = "3.2.0"
solana-clock = "3"
solana-pubkey = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
